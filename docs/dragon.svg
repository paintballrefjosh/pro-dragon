<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .slide { opacity: 0; animation: slide 9s infinite; }
    .s2 { animation-delay: 3s; } .s3 { animation-delay: 6s; }
    @keyframes slide {
      0%   { opacity: 0; transform: translateY(18px); }
      4%   { opacity: 1; transform: translateY(0); }
      29%  { opacity: 1; transform: translateY(0); }
      33%  { opacity: 0; transform: translateY(-18px); }
      100% { opacity: 0; transform: translateY(-18px); }
    }
    .bubble { opacity: 0; animation: bubble 9s infinite; }
    .b2 { animation-delay: 3s; } .b3 { animation-delay: 6s; }
    @keyframes bubble {
      0%, 6% { opacity: 0; transform: scale(.6); }
      10%    { opacity: 1; transform: scale(1.08); }
      13%    { transform: scale(1); }
      29%    { opacity: 1; transform: scale(1); }
      33%, 100% { opacity: 0; transform: scale(.8); }
    }
    .bubble { transform-box: fill-box; transform-origin: 0% 50%; }
    .puff { opacity: 0; animation: puff 2.4s infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes puff { 0% { opacity: .0; transform: translate(0,0) scale(.4); } 20% { opacity: .75; }
                      100% { opacity: 0; transform: translate(26px,-34px) scale(1.5); } }
    .note { opacity: 0; font-size: 26px; fill: #8fb4ff; animation: note 4s infinite; }
    @keyframes note { 0% { opacity: 0; transform: translateY(0); } 15% { opacity: .9; } 100% { opacity: 0; transform: translateY(-60px); } }
    .beam { animation: beam 1.6s ease-in-out infinite; }
    @keyframes beam { 0%,100% { opacity: .16; } 50% { opacity: .26; } }
    .bob { animation: bob 1.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center bottom; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    .wing { animation: wing 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: right center; }
    @keyframes wing { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-9deg); } }
    .blink { animation: blink 4s infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
    .cursor { animation: cur 1s steps(1) infinite; }
    @keyframes cur { 50% { opacity: 0; } }
  </style>

  <!-- room -->
  <rect width="800" height="450" fill="#0b0f14"/>
  <rect y="408" width="800" height="42" fill="#0f151c"/>
  <line x1="0" y1="408" x2="800" y2="408" stroke="#243040" stroke-width="2"/>

  <!-- projector beam + projector -->
  <polygon class="beam" points="478,52 432,34 432,262" fill="#dfe9ff"/>
  <rect x="470" y="34" width="86" height="34" rx="9" fill="#2a3441" stroke="#3a4c63" stroke-width="2"/>
  <circle cx="480" cy="51" r="9" fill="#101820" stroke="#5b8cff" stroke-width="2"/>
  <circle cx="480" cy="51" r="3.5" fill="#dfe9ff"/>
  <rect x="528" y="42" width="20" height="5" rx="2" fill="#18212c"/><rect x="528" y="52" width="20" height="5" rx="2" fill="#18212c"/>
  <line x1="513" y1="34" x2="513" y2="14" stroke="#3a4c63" stroke-width="4"/>

  <!-- projector screen on a tripod -->
  <g stroke="#3a4c63" stroke-width="6" stroke-linecap="round">
    <line x1="232" y1="268" x2="232" y2="396"/><line x1="232" y1="330" x2="188" y2="398"/><line x1="232" y1="330" x2="276" y2="398"/>
  </g>
  <rect x="30" y="30" width="404" height="238" rx="8" fill="#2a3441" stroke="#3a4c63" stroke-width="4"/>
  <rect x="42" y="42" width="380" height="214" rx="4" fill="#0e1319"/>
  <rect x="42" y="42" width="380" height="214" rx="4" fill="#ffffff" opacity=".05"/>
  <text x="54" y="64" font-size="12" fill="#8493a3" letter-spacing="1">CHORUS</text>

  <g class="slide" text-anchor="middle" font-size="31" font-weight="700" fill="#f4f6fa">
    <text x="232" y="140">There is another</text><text x="232" y="182">in the fire</text>
  </g>
  <g class="slide s2" text-anchor="middle" font-size="31" font-weight="700" fill="#f4f6fa">
    <text x="232" y="140">There is another</text><text x="232" y="182" fill="#6fd6ff">in the waters</text>
  </g>
  <g class="slide s3" text-anchor="middle" font-size="31" font-weight="700" fill="#f4f6fa">
    <text x="232" y="140">Holding back</text><text x="232" y="182" fill="#ffd75e">the seas</text>
  </g>

  <text class="note" x="60" y="240" style="animation-delay:0s">♪</text>
  <text class="note" x="380" y="236" style="animation-delay:1.3s">♫</text>
  <text class="note" x="150" y="244" style="animation-delay:2.4s">♪</text>

  <!-- desk -->
  <rect x="440" y="334" width="350" height="16" rx="4" fill="#6b4a2e"/>
  <rect x="456" y="350" width="14" height="58" fill="#563b25"/><rect x="760" y="350" width="14" height="58" fill="#563b25"/>

  <!-- monitor showing the app's graph -->
  <rect x="672" y="238" width="108" height="76" rx="7" fill="#18212c" stroke="#3a4c63" stroke-width="3"/>
  <rect x="680" y="246" width="92" height="56" rx="3" fill="#0e1319"/>
  <line x1="684" y1="274" x2="768" y2="274" stroke="#243040" stroke-width="1.5" stroke-dasharray="3 3"/>
  <polyline points="684,278 696,278 696,262 708,262 708,274 720,274 720,274 732,274 732,284 744,284 744,272 756,272 756,266 768,266"
            fill="none" stroke="#2fbf71" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="684,278 696,278 696,262" fill="none" stroke="#e6b422" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="732,274 732,284 744,284" fill="none" stroke="#e5484d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <rect class="cursor" x="762" y="288" width="6" height="8" fill="#5b8cff"/>
  <rect x="716" y="314" width="20" height="20" fill="#2a3441"/>

  <!-- dragon -->
  <g>
    <!-- tail -->
    <path d="M492 300 C455 305 438 322 440 334 C452 322 468 318 495 318 Z" fill="#26a862"/>
    <polygon points="440,334 428,326 436,320" fill="#e6b422"/>
    <!-- wings -->
    <g class="wing"><path d="M520 232 L478 176 L508 190 L496 150 L534 200 Z" fill="#e6b422" stroke="#c99512" stroke-width="2" stroke-linejoin="round"/></g>
    <g class="wing" style="animation-delay:.3s"><path d="M596 232 L638 176 L608 190 L620 150 L582 200 Z" fill="#e6b422" stroke="#c99512" stroke-width="2" stroke-linejoin="round"/></g>
    <!-- body -->
    <ellipse cx="556" cy="274" rx="64" ry="66" fill="#2fbf71"/>
    <ellipse cx="556" cy="288" rx="40" ry="50" fill="#f1dc8a"/>
    <g stroke="#d7bd62" stroke-width="3" stroke-linecap="round"><line x1="530" y1="268" x2="582" y2="268"/><line x1="528" y1="286" x2="584" y2="286"/><line x1="530" y1="304" x2="582" y2="304"/></g>
    <!-- head, bobbing -->
    <g class="bob">
      <polygon points="520,128 508,98 536,118" fill="#f1dc8a" stroke="#d7bd62" stroke-width="2" stroke-linejoin="round"/>
      <polygon points="592,128 604,98 576,118" fill="#f1dc8a" stroke="#d7bd62" stroke-width="2" stroke-linejoin="round"/>
      <polygon points="540,124 550,102 558,124" fill="#e6b422"/><polygon points="556,122 566,100 574,122" fill="#e6b422"/>
      <ellipse cx="556" cy="168" rx="58" ry="48" fill="#2fbf71"/>
      <ellipse cx="534" cy="192" rx="32" ry="22" fill="#47d487"/>
      <ellipse cx="524" cy="188" rx="4.5" ry="6" fill="#1b6b43"/><ellipse cx="544" cy="188" rx="4.5" ry="6" fill="#1b6b43"/>
      <path d="M516 204 Q534 214 554 204" fill="none" stroke="#1b6b43" stroke-width="3.5" stroke-linecap="round"/>
      <!-- eyes, looking at the screen -->
      <g class="blink"><circle cx="530" cy="154" r="13" fill="#fff"/><circle cx="526" cy="155" r="6.5" fill="#101820"/><circle cx="523.5" cy="152.5" r="2" fill="#fff"/></g>
      <g class="blink"><circle cx="578" cy="154" r="13" fill="#fff"/><circle cx="574" cy="155" r="6.5" fill="#101820"/><circle cx="571.5" cy="152.5" r="2" fill="#fff"/></g>
      <!-- headset -->
      <path d="M502 160 C500 108 612 108 610 160" fill="none" stroke="#4a5b73" stroke-width="7" stroke-linecap="round"/>
      <rect x="494" y="150" width="16" height="30" rx="7" fill="#5b8cff" stroke="#3a64c8" stroke-width="2"/>
      <rect x="602" y="150" width="16" height="30" rx="7" fill="#5b8cff" stroke="#3a64c8" stroke-width="2"/>
      <path d="M498 182 Q500 204 522 206" fill="none" stroke="#4a5b73" stroke-width="4" stroke-linecap="round"/>
      <circle cx="524" cy="206" r="5" fill="#4a5b73"/>
      <!-- smoke puffs -->
      <circle class="puff" cx="516" cy="188" r="7" fill="#c9d3df"/>
      <circle class="puff" cx="516" cy="188" r="6" fill="#c9d3df" style="animation-delay:1.2s"/>
    </g>
  </g>

  <!-- keyboard (in front of the dragon) -->
  <rect x="480" y="324" width="150" height="14" rx="4" fill="#2a3441" stroke="#3a4c63" stroke-width="2"/>
  <g fill="#8b98a7">
    <rect x="486" y="327" width="9" height="4" rx="1"/><rect x="498" y="327" width="9" height="4" rx="1"/><rect x="510" y="327" width="9" height="4" rx="1"/>
    <rect x="522" y="327" width="9" height="4" rx="1"/><rect x="534" y="327" width="9" height="4" rx="1"/><rect x="546" y="327" width="9" height="4" rx="1"/>
    <rect x="558" y="327" width="9" height="4" rx="1"/><rect x="570" y="327" width="9" height="4" rx="1"/><rect x="582" y="327" width="9" height="4" rx="1"/>
    <rect x="594" y="327" width="9" height="4" rx="1"/><rect x="606" y="327" width="9" height="4" rx="1"/><rect x="618" y="327" width="6" height="4" rx="1"/>
  </g>
  <rect x="522" y="327" width="9" height="4" rx="1" fill="#6fd6ff"><animate attributeName="opacity" values="1;.1;1;1" keyTimes="0;.25;.5;1" dur="0.6s" repeatCount="indefinite"/></rect>
  <rect x="582" y="327" width="9" height="4" rx="1" fill="#ffd75e"><animate attributeName="opacity" values="1;1;.1;1" keyTimes="0;.5;.75;1" dur="0.6s" repeatCount="indefinite"/></rect>

  <!-- arms (drawn over the keys): SMIL moves the claws up and down -->
  <line x1="512" y1="250" x2="530" y2="320" stroke="#2fbf71" stroke-width="20" stroke-linecap="round">
    <animate attributeName="y2" values="316;326;316;316" keyTimes="0;.25;.5;1" dur="0.6s" repeatCount="indefinite"/>
  </line>
  <circle cx="530" cy="320" r="13" fill="#47d487"><animate attributeName="cy" values="316;326;316;316" keyTimes="0;.25;.5;1" dur="0.6s" repeatCount="indefinite"/></circle>
  <line x1="600" y1="250" x2="584" y2="320" stroke="#2fbf71" stroke-width="20" stroke-linecap="round">
    <animate attributeName="y2" values="316;316;326;316" keyTimes="0;.5;.75;1" dur="0.6s" repeatCount="indefinite"/>
  </line>
  <circle cx="584" cy="320" r="13" fill="#47d487"><animate attributeName="cy" values="316;316;326;316" keyTimes="0;.5;.75;1" dur="0.6s" repeatCount="indefinite"/></circle>

  <!-- what the dragon is thinking: this slide's delay -->
  <g class="bubble"><path d="M632 150 L618 160 L632 166 Z" fill="#12301f"/><rect x="632" y="128" width="148" height="44" rx="14" fill="#12301f" stroke="#2fbf71" stroke-width="2.5"/>
    <text x="706" y="156" text-anchor="middle" font-size="17" font-weight="800" fill="#2fbf71">−0.3s  ON TIME</text></g>
  <g class="bubble b2"><path d="M632 150 L618 160 L632 166 Z" fill="#33290a"/><rect x="632" y="128" width="148" height="44" rx="14" fill="#33290a" stroke="#e6b422" stroke-width="2.5"/>
    <text x="706" y="156" text-anchor="middle" font-size="17" font-weight="800" fill="#e6b422">−1.1s  EARLY</text></g>
  <g class="bubble b3"><path d="M632 150 L618 160 L632 166 Z" fill="#3a1416"/><rect x="632" y="128" width="148" height="44" rx="14" fill="#3a1416" stroke="#e5484d" stroke-width="2.5"/>
    <text x="706" y="156" text-anchor="middle" font-size="17" font-weight="800" fill="#ff8b8f">+1.8s  LATE</text></g>

  <!-- title -->
  <text x="400" y="436" text-anchor="middle" font-size="20" font-weight="800" fill="#e8edf2" letter-spacing="3">PRO DRAGON</text>
  <text x="400" y="404" text-anchor="middle" font-size="0">.</text>
</svg>
